name: Build OZZY Android APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract OZZY V30 package
        run: unzip -q OZZY_V30_GITHUB_ACTIONS_READY.zip -d ozzy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ozzy/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OZZY-Android-APK
          path: ozzy/android/app/build/outputs/apk/debug/*.apk
